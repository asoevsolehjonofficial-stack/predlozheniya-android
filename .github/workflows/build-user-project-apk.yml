name: Build APK for a user project

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project folder under projects/ (lowercase letters, numbers, hyphens)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: user-apk-${{ inputs.project_slug }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate project slug
        env:
          PROJECT_SLUG: ${{ inputs.project_slug }}
        run: |
          if ! [[ "$PROJECT_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]]; then
            echo "Invalid project slug. Use 1-40 lowercase letters, numbers, or hyphens."
            exit 1
          fi
          test -f "projects/$PROJECT_SLUG/index.html" || {
            echo "Missing projects/$PROJECT_SLUG/index.html"
            exit 1
          }
          if grep -Eiq '(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' "projects/$PROJECT_SLUG/index.html"; then
            echo "Possible secret detected in project HTML; refusing to build."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated project assets and identity
        env:
          PROJECT_SLUG: ${{ inputs.project_slug }}
        run: |
          cp "projects/$PROJECT_SLUG/index.html" app/src/main/assets/index.html
          PACKAGE_SUFFIX="$(echo "$PROJECT_SLUG" | tr '-' '_')"
          sed -i "s/applicationId 'tj.as.predlozheniya'/applicationId 'tj.as.generated.$PACKAGE_SUFFIX'/" app/build.gradle
          sed -i "s/android:label=\"A.S. APP BUILDER\"/android:label=\"$PROJECT_SLUG\"/" app/src/main/AndroidManifest.xml

      - name: Build project APK
        run: gradle --no-daemon assembleDebug

      - name: Upload project APK
        uses: actions/upload-artifact@v4
        with:
          name: project-${{ inputs.project_slug }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
