name: Build APK for a user project

on:
  push:
    branches: [main]
    paths:
      - "projects/*/index.html"
      - ".github/workflows/build-user-project-apk.yml"
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project folder under projects/ (lowercase letters, numbers, hyphens)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: user-apk-${{ inputs.project_slug || 'demo' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate project slug
        env:
          PROJECT_SLUG: ${{ inputs.project_slug || 'demo' }}
        run: |
          if ! [[ "$PROJECT_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]]; then
            echo "Invalid project slug. Use 1-40 lowercase letters, numbers, or hyphens."
            exit 1
          fi
          test -f "projects/$PROJECT_SLUG/index.html" || {
            echo "Missing projects/$PROJECT_SLUG/index.html"
            exit 1
          }
          FILE="projects/$PROJECT_SLUG/index.html"
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -gt 1048576 ]; then
            echo "HTML exceeds 1 MiB limit; refusing to build."
            exit 1
          fi
          if ! grep -Eiq '<!doctype html|<html[[:space:]>]' "$FILE"; then
            echo "Input is not an HTML document."
            exit 1
          fi
          if grep -Eiq '(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,})' "$FILE"; then
            echo "Possible secret detected in project HTML; refusing to build."
            exit 1
          fi
          if grep -Eiq '<script[^>]+src[[:space:]]*=|<iframe[^>]+src[[:space:]]*=|javascript[[:space:]]*:' "$FILE"; then
            echo "Remote script/iframe or javascript: URL detected; refusing to build."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated project assets and identity
        env:
          PROJECT_SLUG: ${{ inputs.project_slug || 'demo' }}
        run: |
          cp "projects/$PROJECT_SLUG/index.html" app/src/main/assets/index.html
          PACKAGE_SUFFIX="p_$(echo "$PROJECT_SLUG" | tr '-' '_')"
          sed -i "s/applicationId 'tj.as.predlozheniya'/applicationId 'tj.as.generated.$PACKAGE_SUFFIX'/" app/build.gradle
          sed -i "s/android:label=\"A.S. APP BUILDER\"/android:label=\"$PROJECT_SLUG\"/" app/src/main/AndroidManifest.xml

      - name: Build project APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and generate checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload project APK
        uses: actions/upload-artifact@v4
        with:
          name: project-${{ inputs.project_slug || 'demo' }}-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
