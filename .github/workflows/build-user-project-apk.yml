name: Build APK for a user project
run-name: "Free APK queue worker"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: as-app-builder-free-apk-queue
  cancel-in-progress: false

env:
  BUILD_API_URL: https://as-app-builder-api.asoev-solehjon-official.workers.dev

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    outputs:
      found: ${{ steps.claim.outputs.found }}
      request_id: ${{ steps.claim.outputs.request_id }}
      project_slug: ${{ steps.claim.outputs.project_slug }}
    steps:
      - name: Verify live backend health
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$BUILD_API_URL/api/health")"
          jq -e '.ok == true and .buildEnabled == true' <<< "$HEALTH" >/dev/null
          echo "Backend health is OK and APK builds are enabled."

      - name: Claim one queued build using short-lived GitHub OIDC
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          RESPONSE="$(curl --fail --silent --show-error --max-time 30 -X POST "$BUILD_API_URL/api/internal/claim" -H "Authorization: Bearer $OIDC_TOKEN" -H "Accept: application/json")"
          FOUND="$(jq -r '.found // false' <<< "$RESPONSE")"
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "request_id=$(jq -r '.requestId // empty' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
          echo "project_slug=$(jq -r '.slug // empty' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
          echo "Queue claim result: $FOUND"

  build:
    needs: claim
    if: needs.claim.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_SLUG: ${{ needs.claim.outputs.project_slug }}
      REQUEST_ID: ${{ needs.claim.outputs.request_id }}
    steps:
      - name: Validate claimed request identifiers
        run: |
          set -euo pipefail
          [[ "$PROJECT_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "Invalid project slug"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "Invalid request ID"; exit 1; }

      - name: Checkout trusted builder source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Fetch private project source using short-lived GitHub OIDC
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          mkdir -p "projects/$PROJECT_SLUG"
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BUILD_API_URL/api/internal/source?requestId=$REQUEST_ID" \
            -o "projects/$PROJECT_SLUG/index.html"
          test -s "projects/$PROJECT_SLUG/index.html"

      - name: Validate project HTML
        run: |
          set -euo pipefail
          FILE="projects/$PROJECT_SLUG/index.html"
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -gt 1048576 ]; then echo "HTML exceeds 1 MiB limit."; exit 1; fi
          grep -Eiq '<!doctype html|<html[[:space:]>]' "$FILE" || { echo "Input is not an HTML document."; exit 1; }
          grep -Eiq '<head[[:space:]>]' "$FILE" && grep -Eiq '<body[[:space:]>]' "$FILE" || { echo "HTML must contain head and body elements."; exit 1; }
          if grep -Eiq '(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,})' "$FILE"; then
            echo "Possible secret detected in project HTML; refusing to build."; exit 1
          fi
          if grep -Eiq '<script[^>]+src[[:space:]]*=|<iframe[^>]+src[[:space:]]*=|javascript[[:space:]]*:' "$FILE"; then
            echo "Remote script/iframe or javascript: URL detected; refusing to build."; exit 1
          fi

      - name: Apply restrictive WebView content policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, sys
          path = Path("projects") / os.environ["PROJECT_SLUG"] / "index.html"
          html = path.read_text(encoding="utf-8")
          if "http-equiv" in html.lower() and "content-security-policy" in html.lower():
              print("Project already declares CSP; refusing ambiguous policy override.")
              sys.exit(1)
          policy = "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'"
          match = re.search(r'<head[^>]*>', html, re.I)
          if not match:
              print("HTML must contain a head element.")
              sys.exit(1)
          meta = '<meta http-equiv="Content-Security-Policy" content="' + policy + '">'
          path.write_text(html[:match.end()] + chr(10) + meta + html[match.end():], encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated project assets and identity
        run: |
          set -euo pipefail
          cp "projects/$PROJECT_SLUG/index.html" app/src/main/assets/index.html
          PACKAGE_SUFFIX="p_$(echo "$PROJECT_SLUG" | tr '-' '_')"
          sed -i "s/applicationId 'tj.as.predlozheniya'/applicationId 'tj.as.generated.$PACKAGE_SUFFIX'/" app/build.gradle
          sed -i "s/android:label=\"A.S. APP BUILDER\"/android:label=\"$PROJECT_SLUG\"/" app/src/main/AndroidManifest.xml

      - name: Build project APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature, package, and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='tj.as.generated."
          HASH="$(sha256sum "$APK" | cut -d ' ' -f1)"
          echo "Verified APK SHA-256: $HASH"
          sha256sum "$APK" > "$APK.sha256"
          sha256sum -c "$APK.sha256"

      - name: Upload APK using short-lived GitHub OIDC
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          HASH="$(sha256sum "$APK" | cut -d ' ' -f1)"
          curl --fail --silent --show-error --max-time 120 \
            -X PUT "$BUILD_API_URL/api/internal/upload?requestId=$REQUEST_ID" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            -H "X-APK-SHA256: $HASH" \
            --data-binary @"$APK" > /tmp/upload-result.json
          grep -q '"ok":true' /tmp/upload-result.json
          echo "Verified APK stored in free Cloudflare KV for 24 hours."

      - name: Mark failed build in the queue
        if: failure()
        continue-on-error: true
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          curl --silent --show-error --max-time 20 -X POST \
            "$BUILD_API_URL/api/internal/fail?requestId=$REQUEST_ID" \
            -H "Authorization: Bearer $OIDC_TOKEN" || true


  dispatch-next:
    needs: [claim, build]
    if: always() && needs.claim.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # A cron event can be delayed or dropped. After processing a real job,
      # dispatch one more pass immediately; an empty queue does not self-loop.
      - name: Trigger next queue pass after processing a job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-user-project-apk.yml/dispatches" \
            -f ref=main
          echo "Requested the next queue pass."
