name: Build APK for a user project
run-name: "Free APK queue worker"
# Keep this workflow runnable on demand; smoke-* jobs verify APK build, emulator launch, and authenticated download.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-user-project-apk.yml"
      - "backend/src/index.js"
      - "backend/test/security.test.js"
      - "backend/test/worker.test.js"
      - "backend/signing-worker.js"
      - "backend/wrangler-signing.toml"
      - ".github/scripts/ensure-signing-key.sh"
      - "app/build.gradle"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/assets/index.html"
  schedule:
    # Primary poll every five minutes plus an offset fallback. GitHub may delay
    # scheduled events under load; the worker chain drains additional jobs.
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: as-app-builder-free-apk-queue
  cancel-in-progress: false

env:
  BUILD_API_URL: https://as-app-builder-api.asoev-solehjon-official.workers.dev
  SIGNING_API_URL: https://as-app-builder-signing.asoev-solehjon-official.workers.dev

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    outputs:
      found: ${{ steps.claim.outputs.found }}
      request_id: ${{ steps.claim.outputs.request_id }}
      project_slug: ${{ steps.claim.outputs.project_slug }}
    steps:
      - name: Verify live backend health
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$BUILD_API_URL/api/health")"
          jq -e '.ok == true and .buildEnabled == true' <<< "$HEALTH" >/dev/null
          echo "Backend health is OK and APK builds are enabled."

      - name: Claim one queued build using short-lived GitHub OIDC
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          RESPONSE="$(curl --fail --silent --show-error --max-time 30 -X POST "$BUILD_API_URL/api/internal/claim" -H "Authorization: Bearer $OIDC_TOKEN" -H "Accept: application/json")"
          FOUND="$(jq -r '.found // false' <<< "$RESPONSE")"
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "request_id=$(jq -r '.requestId // empty' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
          echo "project_slug=$(jq -r '.slug // empty' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
          echo "Queue claim result: $FOUND"

  initialize-signing:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted signing initializer
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Java for keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize or verify permanent signing key
        run: bash .github/scripts/ensure-signing-key.sh

  build:
    needs: [claim, initialize-signing]
    if: always() && needs.claim.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_SLUG: ${{ needs.claim.outputs.project_slug }}
      REQUEST_ID: ${{ needs.claim.outputs.request_id }}
    steps:
      - name: Validate claimed request identifiers
        run: |
          set -euo pipefail
          [[ "$PROJECT_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "Invalid project slug"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "Invalid request ID"; exit 1; }

      - name: Checkout trusted builder source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Fetch private project source using short-lived GitHub OIDC
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          mkdir -p "projects/$PROJECT_SLUG"
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BUILD_API_URL/api/internal/source?requestId=$REQUEST_ID" \
            -o "projects/$PROJECT_SLUG/index.html"
          test -s "projects/$PROJECT_SLUG/index.html"

      - name: Validate project HTML
        run: |
          set -euo pipefail
          FILE="projects/$PROJECT_SLUG/index.html"
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -gt 1048576 ]; then echo "HTML exceeds 1 MiB limit."; exit 1; fi
          grep -Eiq '<!doctype html|<html[[:space:]>]' "$FILE" || { echo "Input is not an HTML document."; exit 1; }
          grep -Eiq '<head[[:space:]>]' "$FILE" && grep -Eiq '<body[[:space:]>]' "$FILE" || { echo "HTML must contain head and body elements."; exit 1; }
          if grep -Eiq '(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,})' "$FILE"; then
            echo "Possible secret detected in project HTML; refusing to build."; exit 1
          fi
          if grep -Eiq '<script[^>]+src[[:space:]]*=|<iframe[^>]+src[[:space:]]*=|javascript[[:space:]]*:' "$FILE"; then
            echo "Remote script/iframe or javascript: URL detected; refusing to build."; exit 1
          fi

      - name: Apply restrictive WebView content policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, sys
          path = Path("projects") / os.environ["PROJECT_SLUG"] / "index.html"
          html = path.read_text(encoding="utf-8")
          if "http-equiv" in html.lower() and "content-security-policy" in html.lower():
              print("Project already declares CSP; refusing ambiguous policy override.")
              sys.exit(1)
          policy = "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'"
          match = re.search(r'<head[^>]*>', html, re.I)
          if not match:
              print("HTML must contain a head element.")
              sys.exit(1)
          meta = '<meta http-equiv="Content-Security-Policy" content="' + policy + '">'
          path.write_text(html[:match.end()] + chr(10) + meta + html[match.end():], encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated project assets and identity
        run: |
          set -euo pipefail
          cp "projects/$PROJECT_SLUG/index.html" app/src/main/assets/index.html
          PACKAGE_SUFFIX="p_$(echo "$PROJECT_SLUG" | tr '-' '_')"
          sed -i "s/applicationId 'tj.as.predlozheniya'/applicationId 'tj.as.generated.$PACKAGE_SUFFIX'/" app/build.gradle
          sed -i "s/android:label=\"A.S. APP BUILDER\"/android:label=\"$PROJECT_SLUG\"/" app/src/main/AndroidManifest.xml

      - name: Load permanent APK signing key
        run: bash .github/scripts/ensure-signing-key.sh

      - name: Build project APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature, package, and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          EXPECTED_CERT="$(keytool -list -v -keystore "$AS_BUILDER_KEYSTORE_PATH" -storetype PKCS12 -storepass "$AS_BUILDER_KEYSTORE_PASSWORD" -alias "$AS_BUILDER_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$EXPECTED_CERT" && test -n "$ACTUAL_CERT" && test "$EXPECTED_CERT" = "$ACTUAL_CERT" || { echo "::error::APK signature does not match the permanent signing key."; exit 1; }
          echo "APK signer certificate matches the permanent signing key."
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='tj.as.generated."
          HASH="$(sha256sum "$APK" | cut -d ' ' -f1)"
          echo "Verified APK SHA-256: $HASH"
          sha256sum "$APK" > "$APK.sha256"
          sha256sum -c "$APK.sha256"

      - name: Install and launch APK in Android emulator (smoke tests only)
        if: startsWith(env.PROJECT_SLUG, 'smoke-')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE_SUFFIX="p_$(echo "$PROJECT_SLUG" | tr '-' '_')"
            PACKAGE="tj.as.generated.$PACKAGE_SUFFIX"
            adb install "$APK"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell dumpsys activity activities | grep -F "$PACKAGE" >/dev/null
            if adb logcat -d -t 1200 | grep -E "FATAL EXCEPTION.*$PACKAGE|Process: $PACKAGE.*died"; then
              echo "::error::The generated APK crashed after launch in the Android emulator."
              exit 1
            fi
            adb shell screencap -p /sdcard/as-builder-smoke.png
            adb pull /sdcard/as-builder-smoke.png "$RUNNER_TEMP/as-builder-smoke.png"
            test -s "$RUNNER_TEMP/as-builder-smoke.png"
            echo "Android emulator smoke test passed: APK installed, launcher activity started, and screenshot captured."

      - name: Upload APK using short-lived GitHub OIDC
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          HASH="$(sha256sum "$APK" | cut -d ' ' -f1)"
          curl --fail --silent --show-error --max-time 120 \
            -X PUT "$BUILD_API_URL/api/internal/upload?requestId=$REQUEST_ID" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            -H "X-APK-SHA256: $HASH" \
            --data-binary @"$APK" > /tmp/upload-result.json
          grep -q '"ok":true' /tmp/upload-result.json
          echo "Verified APK stored in free Cloudflare KV for 24 hours."

      - name: Verify smoke-test APK download endpoint
        if: startsWith(env.PROJECT_SLUG, 'smoke-')
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-signing-key" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          TOKEN_RESPONSE="$(curl --fail --silent --show-error --max-time 30 "$SIGNING_API_URL/api/internal/smoke-token?requestId=$REQUEST_ID" -H "Authorization: Bearer $OIDC_TOKEN" -H "Accept: application/json")"
          DOWNLOAD_TOKEN="$(jq -er '.downloadToken' <<< "$TOKEN_RESPONSE")"
          echo "::add-mask::$DOWNLOAD_TOKEN"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          DOWNLOADED="$RUNNER_TEMP/downloaded-smoke-test.apk"
          curl --fail --silent --show-error --max-time 120 "$BUILD_API_URL/api/download?requestId=$REQUEST_ID" -H "Origin: https://as-app-builder.pages.dev" -H "Authorization: Bearer $DOWNLOAD_TOKEN" -o "$DOWNLOADED"
          ORIGINAL_HASH="$(sha256sum "$APK" | cut -d ' ' -f1)"
          DOWNLOADED_HASH="$(sha256sum "$DOWNLOADED" | cut -d ' ' -f1)"
          test "$ORIGINAL_HASH" = "$DOWNLOADED_HASH" || { echo "::error::Downloaded APK checksum differs from the built APK."; exit 1; }
          echo "Full smoke-test cycle passed: queue, build, permanent signature, upload, authenticated download, and checksum match."

      - name: Mark failed build in the queue
        if: failure()
        continue-on-error: true
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-worker" | jq -r '.value')"
          curl --silent --show-error --max-time 20 -X POST \
            "$BUILD_API_URL/api/internal/fail?requestId=$REQUEST_ID" \
            -H "Authorization: Bearer $OIDC_TOKEN" || true


  dispatch-next:
    needs: [claim, build]
    if: always() && needs.claim.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # A cron event can be delayed or dropped. After processing a real job,
      # dispatch one more pass immediately; an empty queue does not self-loop.
      - name: Trigger next queue pass after processing a job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-user-project-apk.yml/dispatches" \
            -f ref=main
          echo "Requested the next queue pass."
