name: Validate web app
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "predlozheniya.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icon.svg"
      - ".github/workflows/validate-web.yml"
      - ".github/workflows/deploy-backend.yml"
      - "backend/**"
  pull_request:
    paths:
      - "index.html"
      - "predlozheniya.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icon.svg"
      - ".github/workflows/validate-web.yml"
      - ".github/workflows/deploy-backend.yml"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required website files
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s service-worker.js
          test -s icon.svg
          test -s predlozheniya.html
          test -s backend/src/index.js
          test -s backend/wrangler.toml
          test -s backend/package.json
          grep -qi '<html' index.html
          grep -qi '<head' index.html
          grep -qi '<body' index.html

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON is valid')"

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline script blocks found")
          for i, script in enumerate(scripts, 1):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          for script in /tmp/inline-*.js; do
            node --check "$script"
          done

      - name: Check service worker and backend JavaScript syntax
        run: |
          node --check service-worker.js
          node --check backend/src/index.js
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json','utf8'))"

      - name: Check for accidental conflict markers
        run: |
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' index.html predlozheniya.html service-worker.js; then
            echo "Merge conflict markers found"
            exit 1
          fi
