name: Quality and security checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/src/main/assets/index.html"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/**"
      - "app/build.gradle"
      - ".github/workflows/build-user-project-apk.yml"
      - ".github/workflows/build-apk.yml"
      - "backend/**"
      - ".github/workflows/quality-security.yml"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check website and Android asset stay synchronized
        run: |
          cmp --silent index.html app/src/main/assets/index.html || {
            echo "::error::Website HTML and Android WebView asset differ."
            diff -u index.html app/src/main/assets/index.html || true
            exit 1
          }

      - name: Validate HTML, manifest, and security settings
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          activity = Path("app/src/main/java/tj/as/predlozheniya/MainActivity.java").read_text(encoding="utf-8")
          android_manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          build_workflow = Path(".github/workflows/build-user-project-apk.yml").read_text(encoding="utf-8")
          release_workflow = Path(".github/workflows/build-apk.yml").read_text(encoding="utf-8")
          backend = Path("backend/src/index.js").read_text(encoding="utf-8")
          ai_backend = Path("backend/ai-worker.js").read_text(encoding="utf-8")

          assert re.search(r"<!doctype html", html, re.I), "Missing HTML doctype"
          assert re.search(r"<html\b", html, re.I), "Missing html element"
          assert re.search(r"<head\b", html, re.I) and re.search(r"<body\b", html, re.I), "Missing head/body"
          assert "<script" not in html.lower() or not re.search(r"<script\b[^>]*\bsrc\s*=", html, re.I), "External script tags are not allowed in the static builder"
          assert isinstance(manifest.get("name"), str) and manifest["name"], "Web app manifest needs a name"
          assert "android:allowBackup=\"false\"" in android_manifest, "Android backup must be disabled for privacy"
          assert "setAllowFileAccessFromFileURLs(false)" in activity, "Local file URL access must be disabled"
          assert "setAllowContentAccess(false)" in activity, "WebView content-provider access must be disabled"
          assert "setSupportMultipleWindows(false)" in activity, "WebView popups must be disabled"
          assert "setJavaScriptCanOpenWindowsAutomatically(false)" in activity, "Automatic JavaScript popups must be disabled"
          assert "setAllowUniversalAccessFromFileURLs(false)" in activity, "Universal local file access must be disabled"
          assert "MIXED_CONTENT_NEVER_ALLOW" in activity, "Mixed content must be blocked"
          assert 'lowerName.matches' in activity and 'jpe?g|webp' in activity, "Native download bridge must restrict file extensions"
          assert 'url.startsWith("file:///android_asset/")' in activity, "WebView should restrict file navigation to bundled assets"
          assert '"about:blank".equalsIgnoreCase(url)' in activity, "Only about:blank should be permitted for about: URLs"
          assert "javascript:" in build_workflow.lower(), "Build validation should explicitly check javascript: URLs"
          assert "'unsafe-eval'" not in build_workflow, "Generated APK CSP must not permit unsafe-eval"
          assert "connect-src 'none'" in build_workflow, "Generated APK CSP should block network calls by default"
          assert 'id="aiTest"' in html, "Website should expose a real AI API connection test"
          assert "as-app-builder-ai.asoev-solehjon-official.workers.dev" in html, "Website should use the dedicated built-in AI Worker"
          assert "MAX_PROMPT_CHARS" in ai_backend and "RATE_LIMITS" in ai_backend, "Built-in AI Worker must enforce bounded prompts and rate limits"
          assert "Origin is not allowed" in ai_backend, "Built-in AI Worker must validate website origin"
          assert "x-goog-api-key" in html, "Google Gemini requests should send API keys in the header"
          assert ":generateContent?key=" not in html, "Google Gemini API keys must not be placed in the request URL"
          assert "Локальный режим не умеет реализовать такой тип приложения" in html, "Unsupported local app prompts must be routed to AI generation"
          assert "Ответ модели обрезан из-за лимита длины" in html, "Truncated AI responses must be reported instead of packaged"
          assert "permissions:" in build_workflow and "contents: read" in build_workflow, "User-project build should use read-only repository permissions"
          assert "persist-credentials: false" in build_workflow, "User-project build must not persist the checkout token"
          assert "ACTIONS_ID_TOKEN_REQUEST_URL" in build_workflow and "audience=as-app-builder-worker" in build_workflow, "User-project build must use short-lived GitHub OIDC authentication"
          assert "api/internal/source" in build_workflow and "api/internal/upload" in build_workflow, "User-project source and APK must travel through the private backend"
          assert "actions/upload-artifact" not in build_workflow, "User APKs must not be exposed as public workflow artifacts"
          assert "tokenHash" in backend and "verifyGitHubOidc" in backend, "Backend must protect job status/downloads and internal endpoints"
          assert 'env.JOBS.put("apk:" + requestId' in backend and "MAX_APK_BYTES = 18 * 1024 * 1024" in backend, "APKs must use bounded free KV storage"
          assert "git/refs/heads" not in backend, "User project source must not be written to public repository branches"
          assert "persist-credentials: false" in release_workflow, "Build job should not persist the checkout token"
          assert "permissions:\n  contents: read" in release_workflow, "Top-level release workflow permissions must be read-only"
          assert "publish:\n    needs: build" in release_workflow and "contents: write" in release_workflow, "Write permission should be isolated to the release job"
          print("HTML, manifest, Android WebView protections, generated-app CSP, and workflow permissions checks passed.")
          PY

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")
          out = Path("/tmp/as-app-builder-js")
          out.mkdir(parents=True, exist_ok=True)
          for index, script in enumerate(scripts, 1):
              (out / f"script-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript blocks for syntax checking.")
          PY
          for script in /tmp/as-app-builder-js/*.js; do
            node --check "$script"
          done

      - name: Parse workflow YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true); puts "YAML OK: #{f}" }' .github/workflows/*.yml

      - name: Check backend dependencies and JavaScript syntax
        run: |
          cd backend
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/index.js
          node --check ai-worker.js
          npm test
          sed '/^\[\[kv_namespaces\]\]/,/^$/d; /^\[\[r2_buckets\]\]/,/^$/d' wrangler.toml > wrangler-ci.toml
          npx wrangler deploy --dry-run --outdir /tmp/as-builder-worker-dist --config wrangler-ci.toml
          npx wrangler deploy --dry-run --outdir /tmp/as-builder-ai-worker-dist --config wrangler-ai.toml
          rm -f wrangler-ci.toml

      - name: Check for accidentally committed credentials
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' index.html app .github/workflows; then
            echo "::error::Possible credential or private key detected."
            exit 1
          fi
          echo "No common credential patterns found."
