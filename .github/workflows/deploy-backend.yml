name: Deploy A.S. APP BUILDER API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-as-app-builder-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect optional deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are present; optional redeploy is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping optional redeploy: Cloudflare credentials are not configured. Production Worker deployment is managed separately; no repository secret is required for normal CI."
          fi

      - name: Set up Node.js
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        if: steps.credentials.outputs.enabled == 'true'
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        if: steps.credentials.outputs.enabled == 'true'
        working-directory: backend
        run: |
          npx wrangler deploy --config wrangler.toml
          npx wrangler deploy --config wrangler-ai.toml
          npx wrangler deploy --config wrangler-signing.toml
