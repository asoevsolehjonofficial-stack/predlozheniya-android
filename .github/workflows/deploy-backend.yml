name: Deploy secure APK backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-as-app-builder-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configuration
        env:
          JOBS_ID: ${{ vars.AS_BUILDER_JOBS_KV_ID }}
          RATE_LIMITS_ID: ${{ vars.AS_BUILDER_RATE_LIMITS_KV_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.AS_BUILDER_TURNSTILE_SITE_KEY }}
          AS_BUILDER_GITHUB_TOKEN: ${{ secrets.AS_BUILDER_GITHUB_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          BUILD_SOURCE_SECRET: ${{ secrets.AS_BUILDER_BUILD_SOURCE_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$JOBS_ID" || { echo "Missing AS_BUILDER_JOBS_KV_ID variable"; exit 1; }
          test -n "$RATE_LIMITS_ID" || { echo "Missing AS_BUILDER_RATE_LIMITS_KV_ID variable"; exit 1; }
          test -n "$TURNSTILE_SITE_KEY" || { echo "Missing AS_BUILDER_TURNSTILE_SITE_KEY variable"; exit 1; }
          test -n "$AS_BUILDER_GITHUB_TOKEN" || { echo "Missing AS_BUILDER_GITHUB_TOKEN secret"; exit 1; }
          test -n "$TURNSTILE_SECRET" || { echo "Missing TURNSTILE_SECRET secret"; exit 1; }
          test "${#BUILD_SOURCE_SECRET}" -ge 32 || { echo "AS_BUILDER_BUILD_SOURCE_SECRET must be at least 32 characters"; exit 1; }

      - name: Prepare deployment configuration
        working-directory: backend
        env:
          JOBS_ID: ${{ vars.AS_BUILDER_JOBS_KV_ID }}
          RATE_LIMITS_ID: ${{ vars.AS_BUILDER_RATE_LIMITS_KV_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.AS_BUILDER_TURNSTILE_SITE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "REPLACE_WITH_JOBS_KV_NAMESPACE_ID": os.environ["JOBS_ID"],
              "REPLACE_WITH_RATE_LIMITS_KV_NAMESPACE_ID": os.environ["RATE_LIMITS_ID"],
              "REPLACE_WITH_CLOUDFLARE_TURNSTILE_SITE_KEY": os.environ["TURNSTILE_SITE_KEY"],
          }
          for old, new in replacements.items():
              if not new or old not in text:
                  raise SystemExit("Missing or invalid Worker deployment setting: " + old)
              text = text.replace(old, new)
          if "REPLACE_WITH_" in text:
              raise SystemExit("A deployment placeholder remains in wrangler.toml")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install Worker dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Bootstrap Worker so secret uploads have a deployment target
        working-directory: backend
        run: npx wrangler deploy --config wrangler.toml

      - name: Update Worker secrets
        working-directory: backend
        env:
          AS_BUILDER_GITHUB_TOKEN: ${{ secrets.AS_BUILDER_GITHUB_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          BUILD_SOURCE_SECRET: ${{ secrets.AS_BUILDER_BUILD_SOURCE_SECRET }}
        run: |
          printf '%s' "$AS_BUILDER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.toml
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET --config wrangler.toml
          printf '%s' "$BUILD_SOURCE_SECRET" | npx wrangler secret put BUILD_SOURCE_SECRET --config wrangler.toml

      - name: Finalize Worker deployment
        working-directory: backend
        run: npx wrangler deploy --config wrangler.toml
