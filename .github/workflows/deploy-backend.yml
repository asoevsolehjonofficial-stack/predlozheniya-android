name: Deploy A.S. APP BUILDER API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-as-app-builder-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN in repository Actions secrets to use this optional redeploy workflow."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID in repository Actions secrets to use this optional redeploy workflow."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy --config wrangler.toml
