name: Build and publish A.S. APP BUILDER APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build steps receive read-only repository access. Only the tiny release job gets write access.
permissions:
  contents: read

concurrency:
  group: latest-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configure stable signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.AS_BUILDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AS_BUILDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AS_BUILDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AS_BUILDER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No persistent signing key configured; this build uses the temporary debug key."
            exit 0
          fi
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing AS_BUILDER_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing AS_BUILDER_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing AS_BUILDER_KEY_PASSWORD secret" && exit 1)
          KEY_PATH="$RUNNER_TEMP/as-builder-signing.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
          test -s "$KEY_PATH" || (echo "Signing keystore is empty or invalid" && exit 1)
          {
            echo "AS_BUILDER_KEYSTORE_PATH=$KEY_PATH"
            echo "AS_BUILDER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AS_BUILDER_KEY_ALIAS=$KEY_ALIAS"
            echo "AS_BUILDER_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set build version
        run: echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug -PappVersionCode="$APP_VERSION_CODE"

      - name: Verify APK package, signature, and checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='tj.as.predlozheniya'" /tmp/apk-badging.txt
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          (cd dist && sha256sum app-debug.apk > app-debug.apk.sha256)
          stat -c "APK size: %s bytes" dist/app-debug.apk
          (cd dist && sha256sum -c app-debug.apk.sha256)

      - name: Upload verified APK to release job
        uses: actions/upload-artifact@v4
        with:
          name: AS-App-Builder-Verified-APK
          path: |
            dist/app-debug.apk
            dist/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: AS-App-Builder-Verified-APK
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifact
        run: |
          test -s dist/app-debug.apk
          test -s dist/app-debug.apk.sha256
          (cd dist && sha256sum -c app-debug.apk.sha256)

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: A.S. APP BUILDER — Latest Android APK
          body: |
            Latest automatically built APK for A.S. APP BUILDER.
            On Android, open the downloaded APK and confirm installation.
            If Android says the app conflicts with an installed version, uninstall the older test build first, then install this one.
            For seamless updates, the same persistent signing key must be configured in Actions secrets.
            This is a test/debug APK, not a Play Store production release.
          files: |
            dist/app-debug.apk
            dist/app-debug.apk.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
