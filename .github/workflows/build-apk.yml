name: Build and publish A.S. APP BUILDER APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "backend/src/**"
      - "backend/test/**"
      - ".github/scripts/auto-check.mjs"
      - ".github/workflows/auto-check-ai.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - ".github/scripts/ensure-signing-key.sh"
      - "backend/signing-worker.js"
      - "backend/wrangler-signing.toml"
  workflow_dispatch:

# Build steps receive read-only repository access. Only the tiny release job gets write access.
permissions:
  contents: read

env:
  SIGNING_API_URL: https://as-app-builder-signing.asoev-solehjon-official.workers.dev
  SIGNING_PURPOSE: builder

concurrency:
  group: latest-apk-release
  cancel-in-progress: false

jobs:
  # A release must not be published unless source, live site/API, browser, and AI checks pass.
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run backend security and regression tests
        run: node --test backend/test/*.test.js

      - name: Check JavaScript syntax, JSON, and synchronized app assets
        run: |
          set -euo pipefail
          node --check backend/src/index.js
          node --check service-worker.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('backend/package.json','utf8')); console.log('JSON files valid')"
          cmp --silent index.html app/src/main/assets/index.html
          echo "Website and Android assets match."

      - name: Test live website, API, and browser workflow
        env:
          SITE_URL: https://as-app-builder.pages.dev
          API_URL: https://as-app-builder-api.asoev-solehjon-official.workers.dev
        run: node .github/scripts/auto-check.mjs

  initialize-signing:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted signing initializer
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Java for keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize or verify builder APK signing key
        run: bash .github/scripts/ensure-signing-key.sh

  build:
    needs: [initialize-signing, quality-gate]
    if: always() && needs.quality-gate.result == 'success' && (needs.initialize-signing.result == 'success' || needs.initialize-signing.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync the current website into the Android app
        run: |
          set -euo pipefail
          test -s index.html
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cmp -s index.html app/src/main/assets/index.html
          echo "Android APK will contain the current website interface."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Load permanent builder APK signing key
        run: bash .github/scripts/ensure-signing-key.sh

      - name: Set build version
        run: echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug -PappVersionCode="$APP_VERSION_CODE"

      - name: Verify APK package, signature, and checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          EXPECTED_CERT="$(keytool -list -v -keystore "$AS_BUILDER_KEYSTORE_PATH" -storetype PKCS12 -storepass "$AS_BUILDER_KEYSTORE_PASSWORD" -alias "$AS_BUILDER_KEY_ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate SHA-256 digest:' | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$EXPECTED_CERT" && test -n "$ACTUAL_CERT" && test "$EXPECTED_CERT" = "$ACTUAL_CERT" || { echo "::error::Builder APK signature does not match the permanent builder signing key."; exit 1; }
          echo "Builder APK signer certificate matches the permanent signing key."
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='tj.as.predlozheniya'" /tmp/apk-badging.txt
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          (cd dist && sha256sum app-debug.apk > app-debug.apk.sha256)
          stat -c "APK size: %s bytes" dist/app-debug.apk
          (cd dist && sha256sum -c app-debug.apk.sha256)

      - name: Upload verified APK to release job
        uses: actions/upload-artifact@v4
        with:
          name: AS-App-Builder-Verified-APK
          path: |
            dist/app-debug.apk
            dist/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: AS-App-Builder-Verified-APK
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifact
        run: |
          test -s dist/app-debug.apk
          test -s dist/app-debug.apk.sha256
          (cd dist && sha256sum -c app-debug.apk.sha256)

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: A.S. APP BUILDER — Latest Android APK
          body: |
            Latest automatically built APK for A.S. APP BUILDER.
            On Android, open the downloaded APK and confirm installation.
            If Android says the app conflicts with an installed version, uninstall the older test build first, then install this one.
            The release pipeline uses a persistent signing certificate to support repeatable updates.
            This is a test/debug APK, not a Play Store production release.
          files: |
            dist/app-debug.apk
            dist/app-debug.apk.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
