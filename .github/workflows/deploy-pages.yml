name: Publish website
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "predlozheniya.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icon.svg"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-progress deployment merely because another commit arrived.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages must be enabled once in repository Settings → Pages → Source: GitHub Actions.
      # The workflow token may not be allowed to create the Pages site on behalf of the owner.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
