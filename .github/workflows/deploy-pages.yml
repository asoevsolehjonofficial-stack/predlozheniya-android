name: Publish website
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "predlozheniya.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icon.svg"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-progress deployment merely because another commit arrived.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required files and manifest
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s service-worker.js
          test -s icon.svg
          test -s predlozheniya.html
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node --check service-worker.js

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline script blocks found")
          for i, script in enumerate(scripts, 1):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          for script in /tmp/inline-*.js; do node --check "$script"; done

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages must be enabled once in repository Settings → Pages → Source: GitHub Actions.
      # The workflow token may not be allowed to create the Pages site on behalf of the owner.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website files
        run: |
          set -euo pipefail
          mkdir -p site-dist
          cp index.html manifest.webmanifest service-worker.js icon.svg site-dist/
          if [ -f predlozheniya.html ]; then cp predlozheniya.html site-dist/; fi
          touch site-dist/.nojekyll
          test -s site-dist/index.html
          test -s site-dist/manifest.webmanifest
          test -s site-dist/service-worker.js

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
