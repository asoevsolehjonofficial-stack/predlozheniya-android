name: Manual HTML import smoke test

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/src/main/assets/index.html"
      - ".github/workflows/manual-import-smoke.yml"
      - ".github/scripts/manual-import-browser-test.mjs"
  pull_request:
    paths:
      - "index.html"
      - "app/src/main/assets/index.html"
      - ".github/workflows/manual-import-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-html-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check synchronized assets and manual import wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const web = fs.readFileSync('index.html', 'utf8');
          const android = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          assert.equal(web, android, 'Website and Android HTML assets must be identical');

          for (const id of ['manualHtml', 'importManualHtml', 'clearManualHtml']) {
            assert.ok(web.includes('id="' + id + '"') || web.includes("id='" + id + "'"),
              'Missing manual-import control: ' + id);
          }
          assert.ok(web.includes("$('importManualHtml').addEventListener('click'"),
            'Manual import button must have a click handler');
          assert.ok(web.includes("frame.setAttribute('sandbox','allow-scripts')"),
            'Preview must remain sandboxed without allow-same-origin');
          assert.ok(web.includes('function inspectGeneratedHTML(code)'),
            'Manual import should use the existing structural HTML checks');

          const scriptStart = web.indexOf('<script>');
          const scriptEnd = web.indexOf('</script>', scriptStart);
          assert.ok(scriptStart >= 0 && scriptEnd > scriptStart, 'Inline application script not found');
          assert.equal(web.indexOf('<script>', scriptStart + 1), -1, 'Expected one inline application script');
          new Function(web.slice(scriptStart + '<script>'.length, scriptEnd)); // Parse-only syntax check.
          console.log('PASS: assets synchronized; manual import controls wired; sandbox and HTML checks present; JavaScript parses.');
          NODE
      - name: Test manual HTML import in a real browser
        run: node .github/scripts/manual-import-browser-test.mjs
