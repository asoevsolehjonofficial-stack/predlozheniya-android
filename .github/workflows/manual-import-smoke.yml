name: Manual HTML import smoke test

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/src/main/assets/index.html"
      - ".github/workflows/manual-import-smoke.yml"
      - ".github/scripts/manual-import-browser-test.mjs"
  pull_request:
    paths:
      - "index.html"
      - "app/src/main/assets/index.html"
      - ".github/workflows/manual-import-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-html-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check synchronized assets and manual import wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const web = fs.readFileSync('index.html', 'utf8');
          const android = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          assert.equal(web, android, 'Website and Android HTML assets must be identical');

          for (const id of ['manualHtml', 'importManualHtml', 'clearManualHtml']) {
            assert.ok(web.includes('id="' + id + '"') || web.includes("id='" + id + "'"),
              'Missing manual-import control: ' + id);
          }
          assert.ok(web.includes("$('importManualHtml').addEventListener('click'"),
            'Manual import button must have a click handler');
          assert.ok(web.includes("frame.setAttribute('sandbox','allow-scripts')"),
            'Preview must remain sandboxed without allow-same-origin');
          assert.ok(web.includes('function inspectGeneratedHTML(code)'),
            'Manual import should use the existing structural HTML checks');

          const scriptStart = web.indexOf('<script>');
          const scriptEnd = web.indexOf('</script>', scriptStart);
          assert.ok(scriptStart >= 0 && scriptEnd > scriptStart, 'Inline application script not found');
          // The application contains generated HTML templates with literal <script> text.
          // The HTML parser only treats the final, unescaped </script> as the closing tag.
          new Function(web.slice(scriptStart + '<script>'.length, scriptEnd)); // Parse-only syntax check.
          console.log('PASS: assets synchronized; manual import controls wired; sandbox and HTML checks present; JavaScript parses.');
          NODE
      - name: Check deployed backend health without consuming AI quota
        env:
          AI_HEALTH_URL: https://as-app-builder-ai.asoev-solehjon-official.workers.dev/api/health
          API_HEALTH_URL: https://as-app-builder-api.asoev-solehjon-official.workers.dev/api/health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 -H 'Origin: https://as-app-builder.pages.dev' "$AI_HEALTH_URL" -o /tmp/ai-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/ai-health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('ok') is True, f"Built-in AI health check failed: {data}"
          print("PASS: built-in AI Worker health endpoint is reachable; no inference request was sent.")
          PY
          curl --fail --silent --show-error --max-time 15 -H 'Origin: https://as-app-builder.pages.dev' "$API_HEALTH_URL" -o /tmp/api-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/api-health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('ok') is True, f"Build API health check failed: {data}"
          print("PASS: APK build API health endpoint is reachable.")
          PY
      - name: Test manual HTML import and prompt-to-preview flow in a real browser
        run: node .github/scripts/manual-import-browser-test.mjs
