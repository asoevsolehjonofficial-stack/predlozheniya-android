name: Retired duplicate production native acceptance workflow

on:
  push:
    branches: [ops/production-native-acceptance]
    paths: [".github/workflows/production-native-acceptance.yml"]
  workflow_dispatch:

permissions:
  contents: read

# This duplicate was superseded by fix/production-native-acceptance.
# Reusing the same concurrency group with cancellation retires its waiting run.
concurrency:
  group: production-native-acceptance
  cancel-in-progress: true

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use the canonical production acceptance run on fix/production-native-acceptance."
