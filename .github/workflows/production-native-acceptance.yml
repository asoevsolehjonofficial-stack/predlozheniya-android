name: Retire duplicate production acceptance run

on:
  push:
    branches: [ops/production-native-acceptance]
    paths: [".github/workflows/production-native-acceptance.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Different group so this retirement job can start and cancel the duplicate run.
concurrency:
  group: retire-duplicate-production-native-acceptance
  cancel-in-progress: false

jobs:
  retire-duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate run; preserve canonical production acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel 39483118917 --repo asoevsolehjonofficial-stack/predlozheniya-android || true
          echo "Retired duplicate. Canonical run: 39481304323 on fix/production-native-acceptance."
