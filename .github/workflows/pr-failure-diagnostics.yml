name: PR failure diagnostics

# Workflow logs are available reliably after the originating run completes.
# workflow_run avoids racing the still-running job's log archive.
on:
  workflow_run:
    workflows:
      - Quality and security checks
      - Manual HTML import smoke test
      - A.S. AUTO CHECK AI
      - Build and publish A.S. APP BUILDER APK
      - Build APK for a user project
      - Validate web app
      - Deploy A.S. APP BUILDER API
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment-failure-logs:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'fix/ai-quota-native-preview' ||
       contains(toJSON(github.event.workflow_run.pull_requests), '"number":24'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect failed-step logs and comment on PR #24
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/failed-step-logs.txt"
          if gh run view "$RUN_ID" --repo "$REPO" --log-failed > "$LOG_FILE" 2>&1; then
            :
          else
            printf 'GitHub CLI could not retrieve failed-step logs for run %s.\n' "$RUN_ID" >> "$LOG_FILE"
          fi

          # Keep the comment bounded and show the final 200 lines of failed-step output.
          TAIL_FILE="${RUNNER_TEMP}/failed-step-tail.txt"
          tail -n 200 "$LOG_FILE" > "$TAIL_FILE"
          if [ ! -s "$TAIL_FILE" ]; then
            printf 'No failed-step output was returned by GitHub Actions.\n' > "$TAIL_FILE"
          fi

          python3 - "$TAIL_FILE" "$RUN_NAME" "$RUN_ID" "$RUN_URL" "$HEAD_BRANCH" <<'PY' > "${RUNNER_TEMP}/comment.md"
          import json, pathlib, sys
          log_path, name, run_id, run_url, branch = sys.argv[1:]
          log = pathlib.Path(log_path).read_text(encoding='utf-8', errors='replace')
          # GitHub masks registered secrets in Actions logs; apply a conservative
          # extra filter for common credential formats before posting publicly.
          import re
          log = re.sub(r'(?i)(authorization:\s*bearer\s+)\S+', r'\1[REDACTED]', log)
          log = re.sub(r'(?i)(api[_-]?key|token|password|secret)(\s*[=:]\s*)[^\s,;]+', r'\1\2[REDACTED]', log)
          log = log[-55000:]
          print('## GitHub Actions failure diagnostics')
          print()
          print(f'**Workflow:** {name}')
          print(f'**Run:** [{run_id}]({run_url})')
          print(f'**Branch:** `{branch}`')
          print('**Excerpt:** last 200 lines returned by `gh run view --log-failed`.')
          print()
          print('<details><summary>Failed-step log excerpt</summary>')
          print()
          print('```text')
          print(log.rstrip())
          print('```')
          print()
          print('</details>')
          print()
          print('_Automated diagnostic excerpt. Check the linked run for full context; credentials should never be posted in logs._')
          PY

          python3 - "${RUNNER_TEMP}/comment.md" "${RUNNER_TEMP}/comment.json" <<'PYJSON'
          import json, pathlib, sys
          body = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"body": body}), encoding="utf-8")
          PYJSON
          gh api --method POST "repos/${REPO}/issues/24/comments" --input "${RUNNER_TEMP}/comment.json" >/dev/null
          echo "Posted failed-step log excerpt for workflow run ${RUN_ID} to PR #24."
