name: Production Turnstile preflight

on:
  push:
    branches: [fix/production-native-acceptance]
    paths:
      - ".github/workflows/turnstile-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser and verify the real production Turnstile widget
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Confirm Turnstile issues a token without submitting a build or consuming AI quota
        env:
          SITE_URL: https://as-app-builder.pages.dev
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
            let page;
            try {
              page = await browser.newPage();
              await page.goto(process.env.SITE_URL,{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('details summary').first().click({timeout:10000});
              await page.locator('#checkBackend').click({timeout:15000});
              await page.waitForFunction(() => {
                const e=document.querySelector('input[name="cf-turnstile-response"]');
                return !!(e&&e.value&&e.value.length>20);
              },null,{timeout:90000});
              const token=await page.locator('input[name="cf-turnstile-response"]').first().inputValue();
              if(!token||token.length<20) throw new Error('Turnstile token missing.');
              console.log('PRODUCTION_TURNSTILE_PREFLIGHT=passed token_length='+token.length);
              console.log('No build request was submitted; no AI quota was consumed.');
            } catch(e) {
              if(page) try { await page.screenshot({path:'turnstile-preflight-failure.png',fullPage:true}); await require('node:fs').writeFileSync('turnstile-preflight-failure.html', await page.content()); } catch {}
              console.error('PRODUCTION_TURNSTILE_PREFLIGHT=failed '+String(e));
              process.exitCode=1;
            } finally {
              await browser.close();
            }
          })();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turnstile-preflight-evidence
          path: |
            turnstile-preflight-failure.png
            turnstile-preflight-failure.html
          if-no-files-found: warn
          retention-days: 7
