name: Native AI generated APK smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/ai-worker.js"
      - "backend/wrangler-ai.toml"
      - "backend/test/ai-worker.test.js"
      - "native-builder/**"
      - ".github/workflows/native-ai-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-ai-generated-apk-smoke-v4
  cancel-in-progress: false

jobs:
  live-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live website UI without provider inference
        env:
          SITE_URL: https://as-app-builder.pages.dev
          API_URL: https://as-app-builder-api.asoev-soleh-official.workers.dev
          AI_API_URL: https://as-app-builder-ai.asoev-soleh-official.workers.dev
          RUN_LIVE_AI_TEST: "false"
          CHECK_BACKEND_HEALTH: "false"
        run: node .github/scripts/auto-check.mjs

  generated-app:
    needs: live-ui-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        example: [simple, multi-screen, storage]
        api_level: [21, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install Android API 21 emulator image with retries
        if: matrix.api_level == 21
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if yes | sdkmanager --install "platforms;android-21" "system-images;android-21;default;x86"; then exit 0; fi
            echo "API 21 SDK install attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::API 21 SDK install failed after 3 attempts."
          exit 1
      - name: Install Android API 35 emulator image with retries
        if: matrix.api_level == 35
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if yes | sdkmanager --install "system-images;android-35;google_apis;x86_64"; then exit 0; fi
            echo "API 35 SDK install attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::API 35 SDK install failed after 3 attempts."
          exit 1
      - name: Install Worker dev dependency
        working-directory: backend
        run: npm install --no-save wrangler@4
      - name: Start local fixture Worker
        shell: bash
        run: |
          set -euo pipefail
          ./backend/node_modules/.bin/wrangler dev --config backend/wrangler-ai.toml --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/fixture-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fixture-worker.pid"
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/fixture-worker.pid")" 2>/dev/null; then cat "$RUNNER_TEMP/fixture-worker.log"; exit 1; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture-worker.log"
          echo "::error::Local fixture Worker did not become ready."
          exit 1
      - name: Start local build API Worker
        shell: bash
        run: |
          set -euo pipefail
          ./backend/node_modules/.bin/wrangler dev --config backend/wrangler.toml --local --ip 127.0.0.1 --port 8788 > "$RUNNER_TEMP/build-api-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/build-api-worker.pid"
          for attempt in $(seq 1 40); do
            CODE="$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/api/health || true)"
            if [[ "$CODE" == "200" || "$CODE" == "503" ]]; then echo "Local build API Worker is ready (health HTTP $CODE)."; exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/build-api-worker.pid")" 2>/dev/null; then cat "$RUNNER_TEMP/build-api-worker.log"; exit 1; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/build-api-worker.log"
          echo "::error::Local build API Worker did not become ready."
          exit 1
      - name: Request deterministic native source with signed GitHub OIDC token
        env:
          EXAMPLE: ${{ matrix.example }}
          APP_SLUG: ${{ matrix.example == 'multi-screen' && 'multi_screen' || matrix.example }}
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-ai-ci" | jq -er '.value')"
          echo "::add-mask::$OIDC_TOKEN"
          case "$EXAMPLE" in
            simple) PROMPT="Create a simple native Android app with a centered title and a counter button. No network." ;;
            multi-screen) PROMPT="Create a native Android app with multiple screens and Home to Settings navigation. No network." ;;
            storage) PROMPT="Create a native Android notes app with persistent local storage using SharedPreferences. No network." ;;
            *) echo "::error::Unknown fixture example"; exit 1 ;;
          esac
          HTTP_CODE="$(curl --silent --show-error --max-time 30 -o "$RUNNER_TEMP/native-ai-response.json" -w '%{http_code}' -X POST http://127.0.0.1:8787/api/ci/native-fixture -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "$(jq -n --arg prompt "$PROMPT" '{prompt:$prompt}')")"
          test "$HTTP_CODE" = "200" || { cat "$RUNNER_TEMP/native-ai-response.json"; echo "::error::Protected fixture endpoint returned HTTP $HTTP_CODE"; exit 1; }
          jq -e '.provider == "test-fixture" and .mode == "native-android-source"' "$RUNNER_TEMP/native-ai-response.json" >/dev/null
          python3 - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          response = json.loads((Path(os.environ["RUNNER_TEMP"]) / "native-ai-response.json").read_text())
          text = response.get("text")
          if not isinstance(text, str) or not text.strip(): raise SystemExit("Fixture returned no source text.")
          text = re.sub(r"^\s*`{3}(?:json)?\s*|\s*`{3}\s*$", "", text.strip(), flags=re.I)
          data = json.loads(text)
          files = data.get("files")
          if not isinstance(files, list) or not 1 <= len(files) <= 12: raise SystemExit("Invalid fixture file list.")
          root = Path("native-builder/app/src/main")
          for stale in (root / "java/tj/as/generated", root / "java/tj/as/nativebuilder/notes"):
              if stale.exists(): shutil.rmtree(stale)
          seen, total, main_found = set(), 0, False
          for item in files:
              if not isinstance(item, dict) or not isinstance(item.get("path"), str) or not isinstance(item.get("content"), str): raise SystemExit("Malformed source file.")
              rel, source = item["path"], item["content"]
              if not re.fullmatch(r"app/src/main/(?:java/tj/as/generated/[A-Za-z0-9_$]+\.java|res/values/[A-Za-z0-9_.-]+\.xml)", rel) or ".." in rel: raise SystemExit("Disallowed source path: " + rel)
              if rel in seen: raise SystemExit("Duplicate source path.")
              seen.add(rel); size = len(source.encode()); total += size
              if size > 60000 or total > 500 * 1024: raise SystemExit("Source size limit exceeded.")
              if rel.endswith(".java"):
                  if re.search(r"java\.lang\.Runtime|ProcessBuilder|DexClassLoader|PathClassLoader|Class\.forName|System\.loadLibrary|WebView|java\.net\.(?:Socket|URL|URLConnection)", source): raise SystemExit("Restricted API found.")
                  if rel == "app/src/main/java/tj/as/generated/MainActivity.java":
                      if not re.search(r"package\s+tj\.as\.generated\s*;", source) or not re.search(r"class\s+MainActivity\s+extends\s+Activity\b", source): raise SystemExit("Invalid MainActivity.")
                      main_found = True
              elif re.search(r"<!DOCTYPE|<!ENTITY", source, re.I): raise SystemExit("XML document types are forbidden.")
              destination = root / rel.removeprefix("app/src/main/")
              destination.parent.mkdir(parents=True, exist_ok=True); destination.write_text(source)
          if not main_found: raise SystemExit("Missing MainActivity.java.")
          Path(os.environ["RUNNER_TEMP"], "native-files.json").write_text(json.dumps({"files": files}, separators=(",", ":")), encoding="utf-8")
          print("Validated source files:", ", ".join(sorted(seen)))
          PY
          sed -i "s/namespace 'tj.as.nativebuilder.notes'/namespace 'tj.as.generated'/" native-builder/app/build.gradle
          sed -i "s/applicationId 'tj.as.nativebuilder.notes'/applicationId 'tj.as.generated.p_native_${EXAMPLE}_api${{ matrix.api_level }}'/" native-builder/app/build.gradle
          sed -i "s/android:label=\"A.S. Notes Native\"/android:label=\"Native $EXAMPLE API ${{ matrix.api_level }}\"/" native-builder/app/src/main/AndroidManifest.xml
      - name: Create quota-free local API build job
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-native-e2e" | jq -er '.value')"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl --silent --show-error --max-time 30 -o "$RUNNER_TEMP/api-job.json" -w '%{http_code}' -X POST http://127.0.0.1:8788/api/ci/build-fixture -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/native-files.json")"
          test "$CODE" = "201" || { cat "$RUNNER_TEMP/api-job.json"; echo "::error::Local API fixture creation returned HTTP $CODE"; exit 1; }
          jq -e '.requestId and .downloadToken and .status == "building"' "$RUNNER_TEMP/api-job.json" >/dev/null
          echo "::add-mask::$(jq -r '.downloadToken' "$RUNNER_TEMP/api-job.json")"
      - name: Build native APK
        run: gradle --no-daemon -p native-builder clean assembleDebug
      - name: Verify APK package, signature, and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="native-builder/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='tj.as.generated.p_native_${{ matrix.example == 'multi-screen' && 'multi_screen' || matrix.example }}_api${{ matrix.api_level }}'"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
      - name: Upload APK to local API and download it back with access token
        shell: bash
        run: |
          set -euo pipefail
          APK="native-builder/app/build/outputs/apk/debug/app-debug.apk"
          REQUEST_ID="$(jq -er '.requestId' "$RUNNER_TEMP/api-job.json")"
          DOWNLOAD_TOKEN="$(jq -er '.downloadToken' "$RUNNER_TEMP/api-job.json")"
          echo "::add-mask::$DOWNLOAD_TOKEN"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-native-e2e" | jq -er '.value')"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl --silent --show-error --max-time 60 -o "$RUNNER_TEMP/api-upload.json" -w '%{http_code}' -X PUT "http://127.0.0.1:8788/api/ci/upload?requestId=$REQUEST_ID" -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/octet-stream" -H "X-APK-SHA256: $APK_SHA" --data-binary @"$APK")"
          test "$CODE" = "201" || { cat "$RUNNER_TEMP/api-upload.json"; echo "::error::Local API APK upload returned HTTP $CODE"; exit 1; }
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $DOWNLOAD_TOKEN" "http://127.0.0.1:8788/api/download?requestId=$REQUEST_ID" -o "$RUNNER_TEMP/downloaded.apk"
          cmp "$APK" "$RUNNER_TEMP/downloaded.apk"
          test "$(sha256sum "$RUNNER_TEMP/downloaded.apk" | awk '{print $1}')" = "$APK_SHA"
          echo "Local API APK upload/download round-trip passed; SHA-256 $APK_SHA."
      - name: Install, launch, and capture a real emulator screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: ${{ matrix.api_level == 21 && 'default' || 'google_apis' }}
          arch: ${{ matrix.api_level == 21 && 'x86' || 'x86_64' }}
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            APK="native-builder/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="tj.as.generated.p_native_${{ matrix.example == 'multi-screen' && 'multi_screen' || matrix.example }}_api${{ matrix.api_level }}"
            adb install "$APK"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -F "$PACKAGE" >/dev/null
            if adb logcat -d -t 1800 | grep -E "FATAL EXCEPTION.*$PACKAGE|Process: $PACKAGE.*died"; then echo "::error::Generated app crashed."; exit 1; fi
            adb shell screencap -p /sdcard/native-e2e.png
            adb pull /sdcard/native-e2e.png "$RUNNER_TEMP/native-e2e.png"
            test -s "$RUNNER_TEMP/native-e2e.png"
            file "$RUNNER_TEMP/native-e2e.png" | grep -qi 'PNG image'
      - name: Upload emulator screenshot to local API and download it back
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="$(jq -er '.requestId' "$RUNNER_TEMP/api-job.json")"
          DOWNLOAD_TOKEN="$(jq -er '.downloadToken' "$RUNNER_TEMP/api-job.json")"
          echo "::add-mask::$DOWNLOAD_TOKEN"
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=as-app-builder-native-e2e" | jq -er '.value')"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl --silent --show-error --max-time 30 -o "$RUNNER_TEMP/api-preview-upload.json" -w '%{http_code}' -X PUT "http://127.0.0.1:8788/api/ci/preview-upload?requestId=$REQUEST_ID" -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: image/png" --data-binary @"$RUNNER_TEMP/native-e2e.png")"
          test "$CODE" = "200" || { cat "$RUNNER_TEMP/api-preview-upload.json"; echo "::error::Local API preview upload returned HTTP $CODE"; exit 1; }
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $DOWNLOAD_TOKEN" "http://127.0.0.1:8788/api/preview?requestId=$REQUEST_ID" -o "$RUNNER_TEMP/downloaded-preview.png"
          cmp "$RUNNER_TEMP/native-e2e.png" "$RUNNER_TEMP/downloaded-preview.png"
          file "$RUNNER_TEMP/downloaded-preview.png" | grep -qi 'PNG image'
          echo "Local API screenshot upload/download round-trip passed."
      - name: Upload APK and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-${{ matrix.example }}-api-${{ matrix.api_level }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            native-builder/app/build/outputs/apk/debug/app-debug.apk
            native-builder/app/src/main/java/tj/as/generated/
            ${{ runner.temp }}/native-e2e.png
            ${{ runner.temp }}/native-files.json
            ${{ runner.temp }}/api-job.json
            ${{ runner.temp }}/downloaded.apk
            ${{ runner.temp }}/downloaded-preview.png
            ${{ runner.temp }}/apk-sha256.txt
            ${{ runner.temp }}/native-ai-response.json
