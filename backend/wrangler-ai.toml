name = "as-app-builder-ai"
main = "ai-worker.js"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
SITE_ORIGIN = "https://as-app-builder.pages.dev"


[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitCoordinator"]
